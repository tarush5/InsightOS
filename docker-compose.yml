services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: insightos
      POSTGRES_PASSWORD: insightos
      POSTGRES_DB: insightos
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightos"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Runs migrations to completion, then exits. The API waits on it, so a fresh
  # volume comes up with the right schema instead of racing the first request.
  migrate:
    build: { context: ./apps/api, dockerfile: Dockerfile }
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://insightos:insightos@postgres:5432/insightos
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ./apps/api, dockerfile: Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://insightos:insightos@postgres:5432/insightos
      REDIS_URL: redis://redis:6379/0
      SEED_DIR: /data/seed
    ports: ["8000:8000"]
    volumes: ["./seed:/data/seed:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      retries: 6

  worker:
    build: { context: ./apps/api, dockerfile: Dockerfile }
    command: ["arq", "app.workers.alerts.WorkerSettings"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://insightos:insightos@postgres:5432/insightos
      REDIS_URL: redis://redis:6379/0
      SEED_DIR: /data/seed
    volumes: ["./seed:/data/seed:ro"]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ./apps/web, dockerfile: Dockerfile }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
